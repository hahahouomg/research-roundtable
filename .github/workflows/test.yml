name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  roundtable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 -B -m unittest discover -v
      - run: node --check ui/app.js
