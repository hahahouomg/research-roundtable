<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="roundtable-key" content="__LOCAL_KEY__">
  <meta name="color-scheme" content="light dark">
  <title>Roundtable · 科研圆桌</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/visual.css">
  <script defer src="/i18n.js"></script>
  <script defer src="/visual.js"></script>
  <script defer src="/discussion.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside id="rail">
      <div class="brand">
        <span class="brandmark" aria-hidden="true"></span>
        <span class="brand-text">
          <b>Roundtable</b>
          <span class="brand-sub" data-i18n="科研圆桌">科研圆桌</span>
        </span>
        <button id="closeNav" class="mobile iconbtn" aria-label="关闭侧栏" data-i18n-aria-label="关闭侧栏">×</button>
      </div>
      <button id="new" class="new"><b aria-hidden="true">＋</b> <span data-i18n="新讨论">新讨论</span></button>
      <div class="railcap">
        <h2 data-i18n="项目">项目</h2>
        <button id="add" class="iconbtn" title="新建项目" data-i18n-title="新建项目" aria-label="新建项目" data-i18n-aria-label="新建项目">＋</button>
      </div>
      <nav id="projects" aria-label="项目" data-i18n-aria-label="项目"></nav>
      <section id="liveNav" hidden>
        <div class="railcap"><h2 data-i18n="进行中">进行中</h2></div>
        <nav id="liveItems" aria-label="正在进行的讨论" data-i18n-aria-label="正在进行的讨论"></nav>
      </section>
      <div class="railcap historycap"><h2 data-i18n="最近讨论">最近讨论</h2></div>
      <nav id="history" aria-label="最近讨论" data-i18n-aria-label="最近讨论"></nav>
      <div class="railfoot">
        <button id="settings" class="quiet"><span data-icon="settings"></span> <span data-i18n="项目设置">项目设置</span></button>
      </div>
    </aside>
    <button class="scrim" id="scrim" aria-label="关闭侧栏" data-i18n-aria-label="关闭侧栏"></button>
    <main>
      <header>
        <button id="menu" class="mobile iconbtn" aria-label="打开项目和历史" data-i18n-aria-label="打开项目和历史"><span data-icon="menu"></span></button>
        <span class="crumb">
          <span data-icon="folder"></span>
          <span id="projectTitle" data-i18n="项目">项目</span>
          <i aria-hidden="true">/</i>
          <b data-i18n="圆桌">圆桌</b>
        </span>
        <div class="header-actions">
          <label class="sr" for="language" data-i18n="界面语言">界面语言</label>
          <select id="language" class="language">
            <option value="zh-CN" lang="zh-CN">中文</option>
            <option value="en" lang="en">English</option>
          </select>
          <button id="health" class="health" data-i18n="订阅额度">订阅额度</button>
        </div>
      </header>
      <div id="offline" role="status" hidden>
        <span data-i18n="正在重新连接本机圆桌">正在重新连接本机圆桌</span>
        <button class="quiet" id="reconnect" data-i18n="重试">重试</button>
      </div>
      <div id="stage">
        <div class="content">
          <section id="intro" class="intro">
            <div class="intro-copy">
              <h1><span data-i18n="想一起讨论什么">想一起讨论什么</span><span class="intro-question" data-i18n="？">？</span></h1>
              <p class="intro-lead" data-i18n="把想验证的假设、待解的问题或开发任务放上圆桌。">把想验证的假设、待解的问题或开发任务放上圆桌。</p>
            </div>
          </section>
          <section id="conversation" hidden aria-label="讨论详情" data-i18n-aria-label="讨论详情"></section>
          <form id="composer">
            <label class="sr" for="topic" data-i18n="讨论内容">讨论内容</label>
            <textarea id="topic" rows="3" placeholder="写下你的问题…" data-i18n-placeholder="写下你的问题…" required></textarea>
            <div class="composebar">
              <div class="compose-settings">
                <label class="mode">
                  <span data-icon="discuss"></span>
                  <select id="mode" aria-label="讨论方式" data-i18n-aria-label="讨论方式">
                    <option value="both" data-i18n="共同讨论">共同讨论</option>
                    <option value="codex" data-i18n="只问 Codex">只问 Codex</option>
                    <option value="gemini" data-i18n="只问 Gemini">只问 Gemini</option>
                  </select>
                </label>
                <label class="mode" id="moderatorField">
                  <span data-i18n="主持">主持</span>
                  <select id="moderator" aria-label="本轮主持人" data-i18n-aria-label="本轮主持人">
                    <option value="" data-i18n="自动">自动</option>
                    <option value="codex">Codex</option>
                    <option value="gemini">Gemini</option>
                  </select>
                </label>
              </div>
              <button class="primary" id="send" type="submit"><span data-i18n="开始讨论">开始讨论</span> <span data-icon="arrow"></span></button>
            </div>
          </form>
          <section id="participants">
            <div class="sectioncap">
              <h2 data-i18n="讨论席">讨论席</h2>
              <span data-i18n="点击型号可更换">点击型号可更换</span>
            </div>
            <div id="seats"></div>
            <p id="claudeError" class="formerror claude-error" role="alert" hidden></p>
          </section>
        </div>
      </div>
    </main>
  </div>
  <dialog id="reader" aria-labelledby="readerTitle">
    <div class="reader-bar">
      <h2 id="readerTitle"></h2>
      <select id="readerDocs" aria-label="切换文稿" data-i18n-aria-label="切换文稿"></select>
      <button id="readerClose" type="button"><span aria-hidden="true">↩</span><span data-i18n="返回讨论">返回讨论</span></button>
    </div>
    <progress id="readerProgress" max="100" value="0" aria-label="阅读进度" data-i18n-aria-label="阅读进度"></progress>
    <label id="readerOutlineLabel"><span data-i18n="目录">目录</span><select id="readerOutline"></select></label>
    <div class="reader-layout">
      <nav id="readerNav" aria-label="目录" data-i18n-aria-label="目录"></nav>
      <div id="readerScroll" tabindex="0"><article id="readerText" class="prose"></article></div>
    </div>
  </dialog>
  <dialog id="modal" aria-labelledby="modalTitle">
    <div class="dialoghead">
      <h2 id="modalTitle"></h2>
      <button class="iconbtn" id="closeModal" aria-label="关闭" data-i18n-aria-label="关闭">×</button>
    </div>
    <div id="modalBody"></div>
    <p class="formerror" role="alert" hidden id="formError"></p>
  </dialog>
  <div id="notice" role="status" hidden></div>
</body>
</html>
